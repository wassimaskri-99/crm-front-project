<div class="view-wrapper list-page">
  <dx-toolbar class="theme-dependent">
    <dxi-item location="before">
      <span class="toolbar-header"></span>
    </dxi-item>
    <dxi-item location="before">
      <dx-tabs
        secondary="secondary"
        [width]="(screen.xSmallScreenChanged | async) ? 220 : 'auto'"
        [height]="'80vh'"
        [showNavButtons]="false"
        [scrollByContent]="true"
        [selectedIndex]="selectedIndex"
        [items]="taskPanelItems"
        (onItemClick)="tabValueChange($event)"
      ></dx-tabs>
    </dxi-item>

    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="plus"
        text="Add Cotation"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="edit"
        text="Modifier"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="print"
        text="Imprimer"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="send"
        text="Envoyer Cotation"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="export"
        text="Generer Routing Order"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="close"
        text="Cloturer Cotation"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="undo"
        text="Annuler Cotation"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>
    <dxi-item location="after" locateInMenu="auto">
      <dx-button
        icon="copy"
        text="Dupliquer cotation"
        type="default"
        stylingMode="contained"
        (onClick)="addTask()"
      ></dx-button>
    </dxi-item>

    <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxButton"
      showText="inMenu"
      [options]="{
        text: 'Refresh',
        icon: 'refresh',
        onClick: refresh,
        stylingMode: 'text'
      }"
    ></dxi-item>

    <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxButton"
      showText="inMenu"
      [disabled]="!displayGrid"
      [options]="{
        text: 'Column Chooser',
        icon: 'columnchooser',
        onClick: chooseColumnDataGrid,
        stylingMode: 'text'
      }"
    ></dxi-item>

    <dxi-item location="after" locateInMenu="auto">
      <div class="separator"></div>
    </dxi-item>

    <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxButton"
      showText="inMenu"
      [disabled]="displayKanban"
      [options]="{
        text: 'Export to PDF',
        icon: 'exportpdf',
        onClick: exportToPdf,
        stylingMode: 'text'
      }"
    ></dxi-item>

    <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxButton"
      showText="inMenu"
      [disabled]="!displayGrid"
      [options]="{
        text: 'Export to Exel',
        icon: 'exportxlsx',
        onClick: exportDataGridToXSLX,
        stylingMode: 'text'
      }"
    ></dxi-item>

    <dxi-item
      location="after"
      locateInMenu="auto"
      widget="dxTextBox"
      [disabled]="!displayGrid"
      [options]="{
        placeholder: 'Task Search',
        mode: 'search',
        onInput: searchDataGrid
      }"
    ></dxi-item>
    
  </dx-toolbar>

  <ng-container *ngIf="taskCollections$ | async as taskCollections; else loading">
    <ng-container *ngIf="taskCollections" [ngSwitch]="displayTaskComponent">
  
      <!-- CASE: first tab -->
      <div *ngSwitchCase="taskPanelItems[0].text" class="grid">
  
        <!-- Replace task-list-grid by cotation dx-data-grid -->
        <dx-data-grid
          id="cotations-grid"
          class="theme-dependent"
          height="100%"
          [dataSource]="cotations"
          [hoverStateEnabled]="true"
          [columnAutoWidth]="true"
          [showBorders]="true">
  
          <dxo-paging [pageSize]="15"></dxo-paging>
          <dxo-pager [visible]="true" [showPageSizeSelector]="true"></dxo-pager>
          <dxo-editing mode="row" [allowUpdating]="true"></dxo-editing>
          <dxo-selection selectAllMode="allPages" showCheckBoxesMode="always" mode="multiple"></dxo-selection>
          <dxo-scrolling mode="virtual"></dxo-scrolling>
          <dxo-sorting mode="multiple"></dxo-sorting>
          <dxo-header-filter [visible]="true"></dxo-header-filter>
  
          <!-- Columns -->
          <dxi-column dataField="reference" caption="Référence"></dxi-column>
          <dxi-column dataField="dateDemande" caption="Date demande"></dxi-column>
  
          <dxi-column dataField="idDemandeur" caption="Client">
            <dxo-lookup [dataSource]="frameworkSalaire" valueExpr="id" displayExpr="fullName"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idTypeOperation" caption="Type Opération">
            <dxo-lookup [dataSource]="typeOperation" valueExpr="id" displayExpr="designation"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idSens" caption="Sens">
            <dxo-lookup [dataSource]="sensCotation" valueExpr="id" displayExpr="designation"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idNature" caption="Nature">
            <dxo-lookup [dataSource]="natureCotation" valueExpr="id" displayExpr="designation"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idIncoterm" caption="Incoterm">
            <dxo-lookup [dataSource]="incoterms" valueExpr="id" displayExpr="designation"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idPaysDepart" caption="Pays Départ">
            <dxo-lookup [dataSource]="pays" valueExpr="id" displayExpr="libelle"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idPortDepart" caption="Port Départ">
            <dxo-lookup [dataSource]="port" valueExpr="id" displayExpr="libelle"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idPaysArrivee" caption="Pays Arrivée">
            <dxo-lookup [dataSource]="pays" valueExpr="id" displayExpr="libelle"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idPortArrivee" caption="Port Arrivée">
            <dxo-lookup [dataSource]="port" valueExpr="id" displayExpr="libelle"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="tempsEstimTransit" caption="T. Estimatif"></dxi-column>
  
          <dxi-column dataField="idCommercial" caption="Commercial">
            <dxo-lookup [dataSource]="frameworkSalaire" valueExpr="id" displayExpr="fullName"></dxo-lookup>
          </dxi-column>
  
          <dxi-column dataField="idCompany" caption="Armateur"></dxi-column>
  
        </dx-data-grid>
      </div>
    </ng-container>
  </ng-container>
  
  <ng-template #loading>
    <dx-load-panel
      [visible]="true"
      [showPane]="false"
      container=".content"
      [position]="{ of: '.content' }"
    >
    </dx-load-panel>
  </ng-template>
  <form-popup [(visible)]="isAddTaskPopupOpened" (save)= "onClickSaveNewTask()" titleText="New Cotation">
    <task-form [task]="newTask" [isCreateMode]="true"></task-form>
  </form-popup>




</div>
